<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英语打字练习</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #62665f;
      --line: #d9d7ce;
      --green: #1f7a4d;
      --green-soft: #e4f4eb;
      --red: #ba3a2d;
      --red-soft: #fde9e7;
      --blue: #2667a8;
      --blue-soft: #e8f1fb;
      --amber: #9a650f;
      --amber-soft: #fff0ce;
      --shadow: 0 18px 44px rgba(40, 39, 34, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 1fr));
      gap: 8px;
      min-width: min(440px, 100%);
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      border-radius: 8px;
      padding: 10px;
      min-height: 64px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stat strong {
      font-size: 22px;
      line-height: 1;
    }

    .practice {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.1fr 0.8fr 0.8fr auto;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfaf7;
    }

    .control {
      display: grid;
      gap: 6px;
    }

    .control label,
    .toggle label {
      color: var(--muted);
      font-size: 12px;
    }

    select,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    select {
      height: 40px;
      padding: 0 10px;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .toggle {
      display: grid;
      align-content: end;
      gap: 8px;
    }

    .toggle-line {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      color: var(--ink);
      white-space: nowrap;
    }

    .toggle-line input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    .actions {
      display: flex;
      align-items: end;
      gap: 8px;
    }

    .btn {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      min-height: 460px;
    }

    .main {
      padding: 28px;
    }

    .side {
      border-left: 1px solid var(--line);
      background: #fbfaf7;
      padding: 20px;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
      margin-bottom: 22px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      height: 8px;
      background: #e7e2d8;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--green);
      transition: width 180ms ease;
    }

    .prompt {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
      min-height: 156px;
    }

    .word {
      font-size: 56px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .word.sentence {
      font-size: 34px;
      line-height: 1.28;
    }

    .word.long {
      font-size: 28px;
      line-height: 1.35;
    }

    .meaning {
      color: var(--ink);
      font-size: 19px;
      line-height: 1.6;
    }

    .sound {
      width: fit-content;
      max-width: 100%;
      border: 1px solid #f0d48b;
      background: var(--amber-soft);
      color: var(--amber);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .typebox {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .input {
      height: 58px;
      padding: 0 16px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .letters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 42px;
    }

    .letter {
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    .letter.ok {
      color: var(--green);
      background: var(--green-soft);
      border-color: #b9dec8;
    }

    .letter.bad {
      color: var(--red);
      background: var(--red-soft);
      border-color: #edb7b0;
    }

    .letter.current {
      border-color: var(--blue);
      box-shadow: inset 0 0 0 2px var(--blue-soft);
    }

    .feedback {
      min-height: 34px;
      color: var(--muted);
      font-size: 15px;
    }

    .feedback.good {
      color: var(--green);
      font-weight: 700;
    }

    .feedback.bad {
      color: var(--red);
      font-weight: 700;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .review-list {
      display: grid;
      gap: 8px;
      max-height: 312px;
      overflow: auto;
      padding-right: 4px;
    }

    .review-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .review-item strong {
      font-size: 18px;
    }

    .review-item span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .load-error {
      padding: 24px;
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid #edb7b0;
      border-radius: 8px;
      margin: 24px;
    }

    @media (max-width: 860px) {
      .app {
        width: min(100vw - 20px, 720px);
        padding-top: 14px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        min-width: 0;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .actions {
        align-items: stretch;
      }

      .actions .btn {
        flex: 1;
      }

      .workbench {
        grid-template-columns: 1fr;
      }

      .side {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .main {
        padding: 20px;
      }

      .word {
        font-size: 42px;
      }

      .input {
        height: 52px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>英语打字练习</h1>
        <p class="subtitle" id="loadStatus">正在读取练习内容</p>
      </div>
      <section class="stats" aria-label="练习统计">
        <div class="stat"><span>完成</span><strong id="doneStat">0</strong></div>
        <div class="stat"><span>正确率</span><strong id="accuracyStat">0%</strong></div>
        <div class="stat"><span>连击</span><strong id="streakStat">0</strong></div>
        <div class="stat"><span>错题</span><strong id="mistakeStat">0</strong></div>
      </section>
    </header>

    <main class="practice" id="practice" hidden>
      <section class="controls" aria-label="练习设置">
        <div class="control">
          <label for="categorySelect">内容分类</label>
          <select id="categorySelect"></select>
        </div>
        <div class="control">
          <label for="orderSelect">顺序</label>
          <select id="orderSelect">
            <option value="order">顺序</option>
            <option value="shuffle">随机</option>
            <option value="mistakes">错题</option>
          </select>
        </div>
        <div class="toggle">
          <label>辅助</label>
          <div class="toggle-line">
            <input id="showWord" type="checkbox" checked>
            <span>英文目标</span>
          </div>
          <div class="toggle-line">
            <input id="autoSpeak" type="checkbox">
            <span>自动朗读</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="resetBtn" type="button">重来</button>
          <button class="btn" id="speakBtn" type="button">朗读</button>
          <button class="btn primary" id="nextBtn" type="button">下一个</button>
        </div>
      </section>

      <section class="workbench">
        <div class="main">
          <div class="progress-wrap">
            <div class="progress-meta">
              <span id="positionText">0 / 0</span>
              <span id="categoryText">全部</span>
            </div>
            <div class="progress"><span id="progressBar"></span></div>
          </div>

          <div class="prompt">
            <div class="word" id="targetWord"></div>
            <div class="meaning" id="meaningText"></div>
            <div class="sound" id="soundText"></div>
          </div>

          <div class="typebox">
            <input class="input" id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
            <div class="letters" id="letters"></div>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>

        <aside class="side">
          <h2>错题本</h2>
          <div class="review-list" id="reviewList"></div>
          <div class="footer-actions">
            <button class="btn" id="clearMistakesBtn" type="button">清空错题</button>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const els = {
      loadStatus: document.querySelector("#loadStatus"),
      practice: document.querySelector("#practice"),
      categorySelect: document.querySelector("#categorySelect"),
      orderSelect: document.querySelector("#orderSelect"),
      showWord: document.querySelector("#showWord"),
      autoSpeak: document.querySelector("#autoSpeak"),
      resetBtn: document.querySelector("#resetBtn"),
      speakBtn: document.querySelector("#speakBtn"),
      nextBtn: document.querySelector("#nextBtn"),
      answerInput: document.querySelector("#answerInput"),
      targetWord: document.querySelector("#targetWord"),
      meaningText: document.querySelector("#meaningText"),
      soundText: document.querySelector("#soundText"),
      letters: document.querySelector("#letters"),
      feedback: document.querySelector("#feedback"),
      positionText: document.querySelector("#positionText"),
      categoryText: document.querySelector("#categoryText"),
      progressBar: document.querySelector("#progressBar"),
      doneStat: document.querySelector("#doneStat"),
      accuracyStat: document.querySelector("#accuracyStat"),
      streakStat: document.querySelector("#streakStat"),
      mistakeStat: document.querySelector("#mistakeStat"),
      reviewList: document.querySelector("#reviewList"),
      clearMistakesBtn: document.querySelector("#clearMistakesBtn")
    };

    const state = {
      words: [],
      pool: [],
      index: 0,
      done: 0,
      correct: 0,
      attempted: 0,
      streak: 0,
      answeredCurrent: false,
      wrongCurrent: false,
      voice: null,
      canSpeak: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window
    };

    function parseWords(markdown) {
      const words = [];
      let category = "未分类";
      let current = null;
      for (const line of markdown.split(/\r?\n/)) {
        const heading = line.match(/^##\s+\d+\.\s+(.+?)\s+\d+\s+个$/);
        if (heading) {
          category = `单词：${heading[1].trim()}`;
          continue;
        }
        const word = line.match(/^- \*\*(.+?)\*\*：(.+)$/);
        if (word) {
          current = {
            word: word[1].trim(),
            meaning: word[2].trim(),
            sound: "",
            category,
            kind: "word"
          };
          words.push(current);
          continue;
        }
        const sound = line.match(/^\s+- 中文谐音：(.+)$/);
        if (sound && current) {
          current.sound = sound[1].trim();
        }
      }
      return words;
    }

    function parseSentences(markdown) {
      const sentences = [];
      let category = "句型：未分类";
      for (const line of markdown.split(/\r?\n/)) {
        const heading = line.match(/^##\s+\d+\.\s+(.+)$/);
        if (heading) {
          category = `句型：${heading[1].trim()}`;
          continue;
        }
        if (!line.startsWith("|") || line.startsWith("|---") || line.startsWith("| English")) {
          continue;
        }
        const cells = line.trim().slice(1, -1).split("|").map((cell) => cell.trim());
        if (cells.length !== 2) continue;

        const englishParts = cells[0].split(/<br>\s*中文谐音：/);
        const sentence = englishParts[0].trim();
        const sound = (englishParts[1] || "").trim();
        const meaning = cells[1].trim();
        if (!sentence || !meaning) continue;

        sentences.push({
          word: sentence,
          meaning,
          sound,
          category,
          kind: "sentence"
        });
      }
      return sentences;
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function mistakeKeys() {
      try {
        return JSON.parse(localStorage.getItem("basicTypingMistakes") || "[]");
      } catch {
        return [];
      }
    }

    function saveMistakeKeys(keys) {
      localStorage.setItem("basicTypingMistakes", JSON.stringify([...new Set(keys)]));
    }

    function addMistake(word) {
      const keys = mistakeKeys();
      keys.push(word.word);
      saveMistakeKeys(keys);
      renderMistakes();
    }

    function removeMistake(word) {
      saveMistakeKeys(mistakeKeys().filter((key) => key !== word.word));
      renderMistakes();
    }

    function currentWord() {
      return state.pool[state.index] || null;
    }

    function normalize(value) {
      return value.trim().toLowerCase();
    }

    function chooseEnglishVoice() {
      if (!state.canSpeak) return null;
      const voices = window.speechSynthesis.getVoices();
      return voices.find((voice) => /^en[-_]?US/i.test(voice.lang))
        || voices.find((voice) => /^en/i.test(voice.lang))
        || voices[0]
        || null;
    }

    function speakText(text) {
      if (!state.canSpeak || !text) {
        els.feedback.textContent = "当前浏览器不支持英文朗读";
        els.feedback.className = "feedback bad";
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/____/g, "blank"));
      utterance.lang = "en-US";
      utterance.rate = text.length > 30 ? 0.82 : 0.9;
      utterance.pitch = 1;
      state.voice = state.voice || chooseEnglishVoice();
      if (state.voice) utterance.voice = state.voice;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrent() {
      const item = currentWord();
      if (item) speakText(item.word);
    }

    function rebuildPool() {
      const category = els.categorySelect.value;
      const mode = els.orderSelect.value;
      const categoryWords = category === "all"
        ? state.words
        : state.words.filter((item) => item.category === category);

      if (mode === "mistakes") {
        const keys = new Set(mistakeKeys());
        state.pool = categoryWords.filter((item) => keys.has(item.word));
      } else if (mode === "shuffle") {
        state.pool = shuffle(categoryWords);
      } else {
        state.pool = [...categoryWords];
      }

      state.index = 0;
      state.done = 0;
      state.correct = 0;
      state.attempted = 0;
      state.streak = 0;
      state.answeredCurrent = false;
      state.wrongCurrent = false;
      render();
    }

    function renderCategories() {
      const categories = [...new Set(state.words.map((item) => item.category))];
      els.categorySelect.innerHTML = [
        `<option value="all">全部内容</option>`,
        ...categories.map((category) => `<option value="${category}">${category}</option>`)
      ].join("");
    }

    function renderLetters() {
      const item = currentWord();
      if (!item) {
        els.letters.innerHTML = "";
        return;
      }
      const answer = els.answerInput.value;
      const target = item.word;
      const visible = els.showWord.checked;
      els.letters.innerHTML = [...target].map((char, index) => {
        let className = "letter";
        if (index === answer.length) className += " current";
        if (answer[index]) {
          className += answer[index].toLowerCase() === char.toLowerCase() ? " ok" : " bad";
        }
        return `<span class="${className}">${visible ? char : (answer[index] || " ")}</span>`;
      }).join("");
    }

    function renderStats() {
      const accuracy = state.attempted ? Math.round((state.correct / state.attempted) * 100) : 0;
      els.doneStat.textContent = state.done;
      els.accuracyStat.textContent = `${accuracy}%`;
      els.streakStat.textContent = state.streak;
      els.mistakeStat.textContent = mistakeKeys().length;
    }

    function renderMistakes() {
      const keys = new Set(mistakeKeys());
      const items = state.words.filter((word) => keys.has(word.word)).slice(-40).reverse();
      if (!items.length) {
        els.reviewList.innerHTML = `<div class="empty">暂无错题</div>`;
      } else {
        els.reviewList.innerHTML = items.map((item) => `
          <div class="review-item">
            <strong>${item.word}</strong>
            <span>${item.meaning}</span>
            <span>${item.sound}</span>
          </div>
        `).join("");
      }
      renderStats();
    }

    function render() {
      const item = currentWord();
      const total = state.pool.length;
      els.positionText.textContent = total ? `${state.index + 1} / ${total}` : "0 / 0";
      els.progressBar.style.width = total ? `${Math.round((state.index / total) * 100)}%` : "0%";
      els.categoryText.textContent = els.categorySelect.options[els.categorySelect.selectedIndex]?.textContent || "全部";

      if (!item) {
        els.targetWord.className = "word";
        els.targetWord.textContent = "暂无词条";
        els.meaningText.textContent = "当前筛选没有可练习的内容。";
        els.soundText.textContent = "";
        els.answerInput.value = "";
        els.answerInput.disabled = true;
        els.nextBtn.disabled = true;
        els.speakBtn.disabled = true;
        els.feedback.textContent = "";
        els.feedback.className = "feedback";
        els.letters.innerHTML = "";
        renderMistakes();
        return;
      }

      els.answerInput.disabled = false;
      els.nextBtn.disabled = false;
      els.speakBtn.disabled = !state.canSpeak;
      els.targetWord.className = `word${item.kind === "sentence" ? " sentence" : ""}${item.word.length > 42 ? " long" : ""}`;
      els.targetWord.textContent = els.showWord.checked ? item.word : "•".repeat(item.word.length);
      els.meaningText.textContent = item.meaning;
      els.soundText.textContent = `中文谐音：${item.sound || "未填写"}`;
      els.answerInput.value = "";
      els.feedback.textContent = "";
      els.feedback.className = "feedback";
      state.answeredCurrent = false;
      state.wrongCurrent = false;
      renderLetters();
      renderStats();
      window.setTimeout(() => els.answerInput.focus(), 0);
      if (els.autoSpeak.checked) {
        window.setTimeout(speakCurrent, 180);
      }
    }

    function nextWord() {
      if (!state.pool.length) return;
      state.index += 1;
      if (state.index >= state.pool.length) {
        state.index = 0;
        if (els.orderSelect.value === "shuffle") {
          state.pool = shuffle(state.pool);
        }
      }
      render();
    }

    function markCorrect() {
      if (state.answeredCurrent) return;
      const item = currentWord();
      const wasWrong = state.wrongCurrent;
      state.answeredCurrent = true;
      state.done += 1;
      if (!wasWrong) {
        state.correct += 1;
        state.attempted += 1;
      }
      state.streak = wasWrong ? 0 : state.streak + 1;
      removeMistake(item);
      els.feedback.textContent = "正确";
      els.feedback.className = "feedback good";
      renderStats();
      window.setTimeout(nextWord, 360);
    }

    function markWrong() {
      if (state.answeredCurrent || state.wrongCurrent) return;
      const item = currentWord();
      state.wrongCurrent = true;
      state.attempted += 1;
      state.streak = 0;
      addMistake(item);
      els.feedback.textContent = `应输入：${item.word}`;
      els.feedback.className = "feedback bad";
      renderStats();
    }

    els.answerInput.addEventListener("input", () => {
      const item = currentWord();
      if (!item || state.answeredCurrent) return;
      renderLetters();
      if (normalize(els.answerInput.value) === normalize(item.word)) {
        markCorrect();
      }
    });

    els.answerInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        const item = currentWord();
        if (!item) return;
        if (normalize(els.answerInput.value) === normalize(item.word)) {
          markCorrect();
        } else if (els.answerInput.value.trim()) {
          markWrong();
        } else {
          nextWord();
        }
      }
    });

    els.nextBtn.addEventListener("click", () => {
      if (!state.answeredCurrent && !state.wrongCurrent && els.answerInput.value.trim()) {
        markWrong();
        state.done += 1;
        state.answeredCurrent = true;
        renderStats();
        window.setTimeout(nextWord, 500);
      } else if (!state.answeredCurrent && state.wrongCurrent) {
        state.done += 1;
        state.answeredCurrent = true;
        renderStats();
        nextWord();
      } else {
        nextWord();
      }
    });

    els.resetBtn.addEventListener("click", rebuildPool);
    els.categorySelect.addEventListener("change", rebuildPool);
    els.orderSelect.addEventListener("change", rebuildPool);
    els.speakBtn.addEventListener("click", speakCurrent);
    els.autoSpeak.addEventListener("change", () => {
      if (els.autoSpeak.checked) speakCurrent();
    });
    els.showWord.addEventListener("change", () => {
      const item = currentWord();
      if (item) {
        els.targetWord.className = `word${item.kind === "sentence" ? " sentence" : ""}${item.word.length > 42 ? " long" : ""}`;
        els.targetWord.textContent = els.showWord.checked ? item.word : "•".repeat(item.word.length);
        renderLetters();
        els.answerInput.focus();
      }
    });
    els.clearMistakesBtn.addEventListener("click", () => {
      saveMistakeKeys([]);
      renderMistakes();
      if (els.orderSelect.value === "mistakes") rebuildPool();
    });

    if (state.canSpeak) {
      state.voice = chooseEnglishVoice();
      window.speechSynthesis.addEventListener("voiceschanged", () => {
        state.voice = chooseEnglishVoice();
      });
    } else {
      els.speakBtn.disabled = true;
      els.autoSpeak.disabled = true;
    }

    async function boot() {
      try {
        const [wordResponse, sentenceResponse] = await Promise.all([
          fetch("basic-english-850.md", { cache: "no-store" }),
          fetch("daily-english-high-frequency-sentences.md", { cache: "no-store" })
        ]);
        if (!wordResponse.ok || !sentenceResponse.ok) throw new Error("练习内容读取失败");
        const [wordMarkdown, sentenceMarkdown] = await Promise.all([
          wordResponse.text(),
          sentenceResponse.text()
        ]);
        const wordItems = parseWords(wordMarkdown);
        const sentenceItems = parseSentences(sentenceMarkdown);
        state.words = [...wordItems, ...sentenceItems];
        if (!state.words.length) throw new Error("没有解析到练习内容");
        renderCategories();
        els.loadStatus.textContent = `已载入 ${wordItems.length} 个单词，${sentenceItems.length} 条句型`;
        els.practice.hidden = false;
        rebuildPool();
      } catch (error) {
        els.loadStatus.textContent = "练习内容读取失败";
        document.querySelector(".app").insertAdjacentHTML("beforeend", `
          <div class="load-error">
            无法读取 basic-english-850.md 或 daily-english-high-frequency-sentences.md。请通过本地网页服务器打开本页面，并把网页与两个 Markdown 文件放在同一目录。
          </div>
        `);
      }
    }

    boot();
  </script>
</body>
</html>
